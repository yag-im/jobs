[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[project]
name = "jobs"
dynamic = ["version"]
description = "yag asynchronous jobs"
authors = [{ name = "acme-im" }]
keywords = ["jobs", "asynchronous"]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "attrs>=22.2.0",
    "httpx>=0.23.1,<0.29.0",
    "pydantic>=2.0.0,<3.0.0",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "requests>=2.32.3,<3.0.0",
    "schedule>=1.2.2,<2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]
test = [
    "pytest",
    "pytest-dotenv",
]
codegen = [
    "openapi-python-client",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"

[tool.hatch.build.targets.wheel]
packages = ["jobs"]
# generated client is in .gitignore, so it must be force-included
artifacts = ["jobs/services/clients/jukeboxsvc/**/*.py"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["jobs/services/clients/jukeboxsvc"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "ANN",  # flake8-annotations (replaces mypy's disallow_untyped_defs)
    "PL",   # pylint
]
ignore = [
    "ANN401",   # typing.Any is allowed
    "N818",     # exception names don't require an Error suffix
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["jobs"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.pyright]
include = ["jobs", "tests"]
exclude = ["jobs/services/clients/jukeboxsvc"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-s -v"
env_files = [
    "tests/pytest.env",
    ".devcontainer/secret.env"
]
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
